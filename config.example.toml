# Configuración de Mapa de Red.
# Copiá este archivo como config.toml y adaptalo a tu red:
#     cp config.example.toml config.toml
#
# Nada de esto es obligatorio salvo [[sites]]: si no ponés routers/switches,
# el escáner igual encuentra todo lo que responde, pero no va a poder
# confirmar quién está por cable o por wifi (lo va a estimar).

[general]
# Cada cuántos minutos escanea solo mientras el dashboard está abierto (0 = nunca).
scan_interval_minutes = 15
# Escaneo de puertos para adivinar qué es cada equipo (más lento, más info).
port_scan = true
# Usar nmap si está instalado (recomendado; con sudo detecta mejor).
use_nmap = true


# ── Sitios ────────────────────────────────────────────────────────────────
# Una entrada por lugar. Si el fondito comparte la misma red que la casa
# (por ejemplo un repetidor o un AP con cable), poné la misma subred en los
# dos y asigná los equipos al fondito a través del AP de allá (ver abajo).

[[sites]]
id = "casa"
name = "Casa"
subnets = ["192.168.1.0/24"]

[[sites]]
id = "fondito"
name = "Fondito"
subnets = ["192.168.1.0/24"]
# Si el fondito tiene su propio router con otra red, poné su subred, p.ej.:
# subnets = ["192.168.2.0/24"]


# ── Infraestructura: routers, switches, access points, repetidores ────────
# `parent` arma el árbol: qué cuelga de qué.
# `link` = "cable" o "wifi": cómo se conecta este equipo a su padre.

[[infra]]
id = "router-casa"
name = "Router principal"
kind = "router"            # router | switch | ap | repeater
site = "casa"
ip = "192.168.1.1"
# Para saber qué clientes están por wifi en el router, un comando que imprima
# sus MAC. Cualquier MAC que aparezca en la salida se marca como "wifi".
# Ejemplos:
#   OpenWrt:   ssh root@192.168.1.1 "iw dev | awk '/Interface/{print $2}' | xargs -I{} iw dev {} station dump"
#   MikroTik:  ssh admin@192.168.1.1 "/interface wireless registration-table print"
# wifi_clients_command = "ssh root@192.168.1.1 \"iw dev wlan0 station dump; iw dev wlan1 station dump\""

[[infra]]
id = "switch-living"
name = "Switch del living"
kind = "switch"
site = "casa"
parent = "router-casa"
link = "cable"
# Si es un switch administrable con SNMP, el escáner lee en qué puerto está
# cada MAC (requiere el comando `snmpwalk`, paquete net-snmp / snmp).
# ip = "192.168.1.2"
# snmp_community = "public"
# uplink_ports = ["8"]     # puertos que van a otro switch/router (se ignoran)

[[infra]]
id = "ap-fondito"
name = "Access point del fondito"
kind = "ap"
site = "fondito"
parent = "switch-living"
link = "cable"
# ip = "192.168.1.3"
# wifi_clients_command = "ssh root@192.168.1.3 \"iw dev wlan0 station dump\""


# ── Equipos conocidos (opcional) ─────────────────────────────────────────
